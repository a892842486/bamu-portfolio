name: Keep Render Sites Awake

on:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Amiibo Store
        run: |
          curl --fail --silent --show-error --location \
            --max-time 120 --retry 3 --retry-delay 10 \
            https://jdstore20260510.onrender.com

      - name: Ping Bamu Portfolio
        run: |
          curl --fail --silent --show-error --location \
            --max-time 120 --retry 3 --retry-delay 10 \
            https://bamu-portfolio.onrender.com